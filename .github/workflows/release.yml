name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon -> .dmg (osx-aarch64)
          - os: macos-13        # Intel -> .dmg (osx-x64)
          - os: ubuntu-latest   # -> .deb (linux-x64)
          - os: windows-latest  # -> .msi (windows-x64)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run tests
        shell: bash
        run: mvn -B test
      - name: Package
        shell: bash
        run: bash bin/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DiskInventory-${{ matrix.os }}
          path: target/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
